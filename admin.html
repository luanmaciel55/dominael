<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrador | Dominael</title><link rel="stylesheet" href="/assets/styles.css"><link rel="stylesheet" href="/assets/updates.css"><link rel="stylesheet" href="/assets/egg.css"></head><body><main id="login" class="panel"><span class="eyebrow">Administrador</span><h1>Entrar</h1><form id="loginForm"><div class="field"><label>E-mail</label><input id="email" type="email" required></div><div class="field"><label>Senha</label><input id="pass" type="password" required></div><button class="btn btn-primary btn-block">Entrar</button></form><div id="loginMsg"></div></main><main id="dashboard" class="admin-shell hidden"><aside class="sidebar"><a class="brand" href="/">Domina<span>el</span></a><button class="sidebtn active" data-tab="productsPanel">Produtos</button><button class="sidebtn" data-tab="categoriesPanel">Categorias</button><button class="sidebtn" data-tab="creatorsPanel">Autores e idealizadores</button><button class="sidebtn" data-tab="reviewsPanel">Avaliações</button><button class="sidebtn" data-tab="analyticsPanel">Análise</button><button class="sidebtn" data-tab="homePanel">Página inicial</button><button id="logout" class="sidebtn">Sair</button></aside><section class="admin-main"><section id="productsPanel" class="admin-panel"><div class="admin-top"><h1>Produtos</h1><button id="newProduct" class="btn btn-primary">+ Novo produto</button></div><table class="table"><tbody id="productRows"></tbody></table></section><section id="categoriesPanel" class="admin-panel hidden"><h1>Categorias</h1><form id="categoryForm" class="settings-card"><input id="categoryId" type="hidden"><input id="categoryName" required><select id="categoryParent"></select><label><input id="categoryMenuCheck" type="checkbox"> Mostrar no menu</label><label><input id="categoryActive" type="checkbox" checked> Ativa</label><button class="btn btn-primary">Salvar categoria</button><button id="cancelCategory" type="button" class="btn btn-light hidden">Cancelar</button><div id="categoryMsg"></div></form><table class="table"><tbody id="categoryRows"></tbody></table></section><section id="creatorsPanel" class="admin-panel hidden"><h1>Autores e idealizadores</h1><form id="creatorForm" class="settings-card"><input id="creatorId" type="hidden"><input id="creatorName" required><select id="creatorRole"><option value="author">Autor</option><option value="idealizer">Idealizador</option><option value="both">Autor e idealizador</option></select><input id="creatorPhoto" type="file" accept="image/*"><div id="creatorPhotoInfo"></div><div class="field"><label>Descrição</label><textarea id="creatorDescription"></textarea></div><div id="creatorProducts" class="check-grid"></div><label><input id="creatorActive" type="checkbox" checked> Ativo</label><button class="btn btn-primary">Salvar perfil</button><button id="cancelCreator" type="button" class="btn btn-light hidden">Cancelar</button><div id="creatorMsg"></div></form><table class="table"><tbody id="creatorRows"></tbody></table></section><section id="reviewsPanel" class="admin-panel hidden"><h1>Avaliações</h1><form id="reviewForm" class="settings-card"><select id="reviewProduct" required></select><select id="reviewRating"><option value="5">★★★★★ — 5</option><option value="4">★★★★☆ — 4</option><option value="3">★★★☆☆ — 3</option><option value="2">★★☆☆☆ — 2</option><option value="1">★☆☆☆☆ — 1</option><option value="0">☆☆☆☆☆ — 0</option></select><textarea id="reviewComment" required></textarea><button class="btn btn-primary">Adicionar avaliação</button><div id="reviewMsg"></div></form><div id="reviewRows"></div></section><section id="analyticsPanel" class="admin-panel hidden"><h1>Análise</h1><button id="refreshAnalytics" class="btn btn-light">Atualizar</button><div class="analytics-tabs"><button class="analytics-period active" data-period="day">Hoje / 24h</button><button class="analytics-period" data-period="7days">7 dias</button><button class="analytics-period" data-period="month">1 mês</button><button class="analytics-period" data-period="year">1 ano</button><button class="analytics-period" data-period="all">Sempre</button></div><div id="analyticsMsg"></div><div id="analyticsCards" class="analytics-grid"></div></section><section id="homePanel" class="admin-panel hidden"><h1>Página inicial</h1><form id="settingsForm" class="settings-card"><input id="homePhraseInput"><select id="featuredProduct" class="hidden"></select><label><input id="showCreatorsMenu" type="checkbox" checked> Mostrar autores e idealizadores</label><input id="whatsappChannelUrl" type="url"><label><input id="showWhatsappInvite" type="checkbox"> Mostrar convite WhatsApp</label><input id="supportWhatsapp" inputmode="tel"><label><input id="showSupport" type="checkbox" checked> Mostrar suporte</label><textarea id="footerTextInput"></textarea><button class="btn btn-primary">Salvar página inicial</button><div id="settingsMsg"></div></form></section></section></main><div id="modal" class="modal"><div class="modal-card"><div class="admin-top"><h2 id="modalTitle">Produto</h2><button id="closeModal" class="btn btn-light">Fechar</button></div><form id="productForm"><input id="productId" type="hidden"><div class="field"><label>Nome</label><input id="pName" required></div><div class="field"><label>Categoria</label><select id="pCategory"></select></div><div class="field"><label>Autores e idealizadores</label><select id="pCreators" multiple></select></div><div class="field"><label>Descrição curta</label><input id="pShort"></div><div class="field"><label>Descrição completa</label><textarea id="pDescription" required></textarea></div><div class="free-admin-box"><label><input id="pFree" type="checkbox"> <b>Produto gratuito</b></label><div class="mini">O botão público ficará “Receber grátis”.</div><label id="freeCaptureLabel" class="hidden"><input id="pFreeCapture" type="checkbox"> Pedir nome e WhatsApp antes de liberar</label></div><div class="row"><div id="priceField" class="field"><label>Preço</label><input id="pPrice" type="number" min="1" step=".01"></div><div id="passwordField" class="field"><label>Senha fixa</label><input id="pPassword"></div></div><div class="field"><label>Foto da capa</label><input id="pCover" type="file" accept="image/*"></div><div class="extra-photo-grid"><input id="pPhoto1" type="file" accept="image/*"><input id="pPhoto2" type="file" accept="image/*"><input id="pPhoto3" type="file" accept="image/*"></div><div id="mediaInfo"></div><input id="pVideo" type="file" accept="video/*"><div class="field"><label>Entrega</label><select id="pDelivery"><option value="download">Download de arquivo</option><option value="external">Acesso por link externo</option></select></div><div id="downloadFields"><input id="pFile" type="file"></div><div id="externalFields" class="hidden"><input id="pExternal" type="url" placeholder="https://..."></div><label><input id="pActive" type="checkbox" checked> Produto ativo</label><button class="btn btn-primary btn-block">Salvar produto</button></form><div id="formMsg"></div></div></div><script src="/assets/config.js"></script><script type="module" src="/assets/admin.js"></script><script type="module" src="/assets/admin-enhance.js"></script><script type="module" src="/assets/game-admin.js"></script><script type="module" src="/assets/egg-admin.js"></script><script type="module" src="/assets/featured-admin.js"></script></body></html>
