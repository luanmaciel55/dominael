<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pagamento | Dominael</title><link rel="stylesheet" href="/assets/styles.css"></head><body><header class="topbar"><div class="container nav"><a class="brand" href="/">Domina<span>el</span></a><span class="safe"><span class="dot"></span>Site seguro</span></div></header><main><section class="panel"><span class="eyebrow">Pagamento</span><h1>Confirmando sua compra</h1><div id="state" class="notice">Verificando o pagamento diretamente com a InfinitePay...</div><div id="access" class="hidden"></div></section></main><script src="/assets/config.js"></script><script src="/assets/app.js"></script><script>(async()=>{const q=Object.fromEntries(new URLSearchParams(location.search));const box=document.querySelector('#state');const acc=document.querySelector('#access');try{if(!q.order_nsu||!q.transaction_nsu||!q.slug)throw new Error('Dados de confirmação incompletos.');const d=await fn('payment-check',{method:'POST',body:JSON.stringify(q)});if(!d.paid)throw new Error('Pagamento ainda não confirmado.');box.className='notice success';box.innerHTML='<b>Pagamento confirmado!</b><br>Seu produto está liberado.';const label=d.delivery_type==='external'?'Acessar produto':'Baixar agora';const target=d.delivery_type==='external'?' target="_blank" rel="noopener noreferrer"':'';acc.className='';acc.innerHTML=`<div class="paybox"><h3>${esc(d.product.name)}</h3><p class="mini">Guarde esta senha. Você poderá usá-la em <b>Acesso ao seu produto</b> sempre que quiser acessar novamente.</p><div class="notice"><b>Sua senha:</b><br><span style="font-size:22px;font-weight:900">${esc(d.access_password)}</span></div><a class="btn btn-primary btn-block" style="margin-top:12px" href="${esc(d.access_url)}"${target}>${label}</a><a class="btn btn-light btn-block" style="margin-top:10px" href="/acesso.html">Acesso ao seu produto</a></div>`}catch(e){box.className='notice error';box.textContent=e.message}})()</script></body></html>
