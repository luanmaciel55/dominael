<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acesso ao seu produto | Dominael</title><link rel="stylesheet" href="/assets/styles.css"></head><body><header class="topbar"><div class="container nav"><a class="brand" href="/">Domina<span>el</span></a><span class="safe"><span class="dot"></span>Site seguro</span></div></header><main><section class="panel"><span class="eyebrow">Acesso ao seu produto</span><h1>Acesse novamente quando precisar</h1><p class="mini">Digite a senha recebida após a compra.</p><form id="accessForm"><div class="field"><label>Senha do produto</label><input id="password" type="password" required autocomplete="off" placeholder="Digite sua senha"></div><button class="btn btn-primary btn-block">Acessar produto</button></form><div id="result" style="margin-top:18px"></div></section></main><script src="/assets/config.js"></script><script src="/assets/app.js"></script><script>document.querySelector('#accessForm').addEventListener('submit',async e=>{e.preventDefault();const out=document.querySelector('#result');out.innerHTML='<div class="notice">Verificando...</div>';try{const d=await fn('access-product',{method:'POST',body:JSON.stringify({password:document.querySelector('#password').value})});const label=d.delivery_type==='external'?'Acessar produto':'Baixar produto';const target=d.delivery_type==='external'?' target="_blank" rel="noopener noreferrer"':'';out.innerHTML=`<div class="notice success"><b>${esc(d.product.name)}</b><br>Acesso autorizado.</div><a class="btn btn-primary btn-block" style="margin-top:12px" href="${esc(d.access_url)}"${target}>${label}</a>`}catch(err){out.innerHTML=`<div class="notice error">${esc(err.message)}</div>`}})</script></body></html>
